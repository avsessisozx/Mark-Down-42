name: Derle ve test et

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10"

      - name: Birim testleri
        run: python -m unittest tests.test_units -v

      - name: Uçtan uca testler (gerçek Microsoft Edge + sahte Instagram)
        env:
          REELS_GOZLEMCI_BROWSER: msedge
        run: python -m unittest tests.test_integration -v

      - name: EXE derle
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name ReelsGozlemci
          --icon assets/icon.ico
          --add-data "reels_gozlemci/ui;reels_gozlemci/ui"
          --add-data "reels_gozlemci/chrome_eklenti;reels_gozlemci/chrome_eklenti"
          --collect-all playwright
          main.py

      - name: EXE'yi dene
        shell: pwsh
        run: |
          $out = "$PWD\selftest.txt"
          $env:REELS_GOZLEMCI_SELFTEST_OUT = $out
          Remove-Item $out -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist\ReelsGozlemci.exe" -ArgumentList "--self-test" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "EXE öz testi zaman aşımı" }
          $r = Get-Content $out -Raw
          Write-Host "öz test => $r"
          if (-not $r.StartsWith("OK")) { throw "EXE öz testi başarısız: $r" }
          "{0:N1} MB" -f ((Get-Item dist\ReelsGozlemci.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: ReelsGozlemci
          path: dist/ReelsGozlemci.exe

  eklenti:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Chrome eklentisi uçtan uca (gerçek Chromium'a yüklenir)
        env:
          REELS_GOZLEMCI_BROWSER: chromium
        run: python -m unittest tests.test_extension -v

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, eklenti]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm numarasını oku
        id: ver
        run: echo "version=$(python3 -c 'import reels_gozlemci as d; print(d.__version__)')" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Reels Gözlemci ${{ steps.ver.outputs.version }}
          make_latest: true
          files: dist/ReelsGozlemci/ReelsGozlemci.exe
          body_path: surum-notu.md
